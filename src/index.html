<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>易户型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <strong>易户型</strong>
            <em>参考线生成墙体</em>
          </div>
        </div>
        <div class="header-actions">
          <div class="action-group">
            <button id="undo" type="button">撤销</button>
            <button id="redo" type="button">重做</button>
            <button id="fit" type="button">适配</button>
          </div>
          <div class="action-group">
            <button id="save-json" type="button">保存 JSON</button>
            <button id="load-json-button" type="button">载入 JSON</button>
            <input id="load-json" type="file" accept="application/json,.json" hidden />
          </div>
          <div class="action-group">
            <button id="export-png" type="button" class="primary">导出 PNG</button>
            <button id="export-svg" type="button">导出 SVG</button>
          </div>
          <div class="action-group">
            <button id="clear" type="button">清空墙体</button>
          </div>
        </div>
      </header>
      <div class="workspace">
        <aside id="sidebar">
          <section id="panel-x"></section>
          <section id="panel-y"></section>
          <section id="readout"></section>
        </aside>
        <section class="board">
          <div class="toolbar" id="toolbar">
            <button type="button" class="tool" data-tool="select" aria-pressed="true" title="选择 (V)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l6.2 15 2.1-6.2L19.5 11z"/></svg>
              <span>选择</span><kbd>V</kbd>
            </button>
            <button type="button" class="tool" data-tool="wall" title="画墙 (W)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M4 8v8M20 8v8"/></svg>
              <span>画墙</span><kbd>W</kbd>
            </button>
            <button type="button" class="tool" data-tool="erase" title="擦除 (E)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h6M14 12h6M9 9l3 6"/></svg>
              <span>擦除</span><kbd>E</kbd>
            </button>
            <button type="button" class="tool" data-tool="door" title="门 (D)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 19V6h3M10 6a8 8 0 0 1 0 13"/></svg>
              <span>门</span><kbd>D</kbd>
            </button>
            <button type="button" class="tool" data-tool="window" title="窗 (N)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="10"/><path d="M4 12h16M12 7v10"/></svg>
              <span>窗</span><kbd>N</kbd>
            </button>
            <button type="button" class="tool" data-tool="slide" title="推拉门 (S)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="10"/><path d="M4 12h16M12 7v10"/><path d="M4 12h8v5H4zM12 7h8v5h-8z" style="fill:currentColor;stroke:none"/></svg>
              <span>推拉门</span><kbd>S</kbd>
            </button>
            <button type="button" class="tool" data-tool="bay" title="飘窗 (B)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12"/><path d="M7 18l10-12M4 13l5 5M15 6l5 6"/></svg>
              <span>飘窗</span><kbd>B</kbd>
            </button>
            <button type="button" class="tool" data-tool="label" title="标签 (L)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h11l5 4-5 4H4z"/></svg>
              <span>标签</span><kbd>L</kbd>
            </button>
            <div id="toast" role="status"></div>
          </div>
          <div class="stage" id="stage">
            <canvas id="plan" aria-label="户型图画布"></canvas>
            <input id="label-editor" maxlength="20" autocomplete="off" aria-label="空间标签" list="room-names" placeholder="例如：客厅" />
            <datalist id="room-names">
              <option value="客厅"></option>
              <option value="餐厅"></option>
              <option value="卧室"></option>
              <option value="主卧"></option>
              <option value="次卧"></option>
              <option value="书房"></option>
              <option value="厨房"></option>
              <option value="卫生间"></option>
              <option value="阳台"></option>
              <option value="玄关"></option>
            </datalist>
            <div id="hint"></div>
            <div id="status"></div>
            <section id="selection" aria-label="选中元素"></section>
            <p id="boot">正在打开户型图。</p>
          </div>
        </section>
        <aside id="guide">
          <h2>怎么画</h2>
          <ol class="steps">
            <li>填写横向、纵向间隔，生成参考线。要切得更细时，用多条序列交叉后再结算。</li>
            <li>只在交叉点之间连墙，墙厚 120 mm。</li>
            <li>在墙上开门、按一段一段标出窗和推拉门，再给地板标飘窗、给空间命名。</li>
          </ol>
          <p class="rules">墙以参考线为中心，厚度固定 120 mm。门洞宽度固定 800 mm，不能把点放在交叉点之外。选中墙、门或空间后，在画布左下角编辑。</p>
        </aside>
      </div>
    </div>
    <dialog id="split-dialog">
      <form id="split-form">
        <h2>拆分间隔</h2>
        <p id="split-help"></p>
        <label class="split-field">第一段
          <input id="split-value" type="number" min="300" max="100000" step="1" inputmode="numeric" />
          <em>mm</em>
        </label>
        <p id="split-preview"></p>
        <div class="dialog-actions">
          <button type="button" id="split-cancel">取消</button>
          <button type="submit" class="primary">拆分</button>
        </div>
      </form>
    </dialog>
    <dialog id="sequence-dialog">
      <form id="sequence-form">
        <h2 id="sequence-title">多序列切分</h2>
        <p id="sequence-help">每条序列都从起点量起。保存时合并所有切分点，结算成一条间隔。</p>
        <div id="sequence-editor"></div>
        <p id="sequence-preview"></p>
        <div class="dialog-actions">
          <button type="button" id="sequence-cancel">取消</button>
          <button type="submit" class="primary">结算并保存</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
